<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Win እጣ - ዲጂታል የዕጣ ጨዋታ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f9; text-align: center; margin: 0; padding: 15px; color: #333; }

        .card { background: #ffffff; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); text-align: left; }
        
        .btn { width: 100%; padding: 14px; font-size: 16px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-success { background: #27ae60; }
        .btn-back { background: #e0e0e0; color: #333; padding: 8px 15px; width: auto; font-size: 13px; float: left; margin-bottom: 10px; }

        .view { display: none; }
        .view.active { display: block; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .menu-btn { background: #fff; border: 2px solid #3498db; color: #3498db; padding: 25px 10px; border-radius: 10px; font-weight: bold; font-size: 18px; cursor: pointer; text-align: center; }
        .menu-btn:active { background: #3498db; color: white; }

        .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; margin-top: 15px; }
        .ticket { padding: 8px 0; background: #f8f9fa; border: 1px solid #ddd; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 12px; text-align: center; }
        .ticket.taken { background: #e74c3c; color: white; cursor: not-allowed; border-color: #c0392b; }
        .ticket.selected { background: #2ecc71; color: white; border-color: #27ae60; }
    </style>
</head>
<body>

    <!-- 1. REGISTRATION / WELCOME VIEW -->
    <div id="view-register" class="view active">
        <div style="margin-top: 40px;">
            <h2>🎉 እንኳን ወደ Win እጣ በደህና መጡ!</h2>
            <p style="color: #666; font-size: 14px; margin-bottom: 25px;">እጣዎችን በመግዛት አስደናቂ ሽልማቶችን ያሸንፉ። ለመጀመር እባክዎ ቁጥርዎን ያጋሩ።</p>
            <button class="btn btn-success" onclick="registerUser()">📱 ኑካ/ስልክ ቁጥር አጋራ (Share Contact)</button>
        </div>
    </div>

    <!-- 2. MAIN MENU VIEW -->
    <div id="view-menu" class="view">
        <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <div id="menuUserName" style="font-weight: bold; font-size: 16px;">ተጫዋች</div>
                <div id="menuUserBalance" style="color: #27ae60; font-size: 14px; font-weight: bold; margin-top: 4px;">ባላንስ: 0 ብር</div>
            </div>
        </div>

        <h3 style="text-align: left; margin: 25px 0 10px 0;">ዋና ምረጭ</h3>
        <div class="menu-grid">
            <div class="menu-btn" style="grid-column: span 2; background: #2980b9; color: white;" onclick="switchView('view-prices')">🎮 Play እጣ</div>
        </div>
    </div>

    <!-- 3. PLAY - PRICE SELECTION -->
    <div id="view-prices" class="view">
        <button class="btn btn-back" onclick="switchView('view-menu')">← ተመለስ</button>
        <div style="clear: both;"></div>
        <h3>የእጣ ዋጋ ይምረጡ</h3>
        <div class="menu-grid">
            <div class="menu-btn" onclick="selectPrice(50)">50 ብር</div>
            <div class="menu-btn" onclick="selectPrice(100)">100 ብር</div>
            <div class="menu-btn" onclick="selectPrice(200)">200 ብር</div>
            <div class="menu-btn" onclick="selectPrice(300)">300 ብር</div>
            <div class="menu-btn" onclick="selectPrice(400)">400 ብር</div>
            <div class="menu-btn" onclick="selectPrice(500)">500 ብር</div>
        </div>
    </div>

    <!-- 3.1. PLAY - ROOM SELECTION -->
    <div id="view-rooms" class="view">
        <button class="btn btn-back" onclick="switchView('view-prices')">← ተመለስ</button>
        <div style="clear: both;"></div>
        <h3 id="roomSelectionTitle">የክፍል ዓይነት ይምረጡ</h3>
        <div id="roomListContainer"></div>
    </div>

    <!-- 3.2. PLAY - TICKET GRID VIEW -->
    <div id="view-game" class="view">
        <button class="btn btn-back" onclick="switchView('view-rooms')">← ተመለስ</button>
        <div style="clear: both;"></div>
        <h3 id="gameRoomTitle"></h3>
        <p id="gamePoolInfo" style="font-size: 13px; color: #d35400; font-weight: bold;"></p>
        <p id="gamePrizesInfo" style="font-size: 13px; color: #27ae60; background: #e8f8f5; padding: 10px; border-radius: 6px; line-height: 1.5;"></p>
        
        <div class="card" style="padding: 10px;">
            <p style="margin: 0; font-size: 13px; color: #555;">የሚፈልጉትን እጣ ቁጥር ይምረጡ (ከ1-100):</p>
            <div class="grid" id="ticketGrid"></div>
        </div>
        <button class="btn btn-success" onclick="buyTicket()">እጣ ቁረጥ</button>
    </div>

    <script>
        const tg = window.Telegram ? window.Telegram.WebApp : null;
        if (tg) tg.expand();

        let currentUser = JSON.parse(localStorage.getItem('win_user')) || null;
        let userBalance = parseInt(localStorage.getItem('win_balance')) || 1000;
        let selectedPrice = 50;
        let selectedRoomMaxPlayers = 20;
        let selectedTicket = null;

        window.onload = function() {
            if (currentUser) {
                switchView('view-menu');
                updateUserDataUI();
            } else {
                switchView('view-register');
            }
        };

        function switchView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
        }

        function registerUser() {
            try {
                const tgUser = tg?.initDataUnsafe?.user;
                currentUser = {
                    id: tgUser ? tgUser.id : 'user-' + Math.floor(Math.random() * 10000),
                    name: tgUser ? (tgUser.username ? `@${tgUser.username}` : (tgUser.first_name || 'ተጫዋች')) : 'ተጫዋች-ሞባይል'
                };
                localStorage.setItem('win_user', JSON.stringify(currentUser));
                updateUserDataUI();
                switchView('view-menu');
                alert(`እንኳን ደህና መጡ ${currentUser.name}! ምዝገባዎ ተጠናቋል።`);
            } catch (e) {
                currentUser = { id: 'user-' + Math.floor(Math.random() * 10000), name: 'ተጫዋች-ሞባይል' };
                localStorage.setItem('win_user', JSON.stringify(currentUser));
                updateUserDataUI();
                switchView('view-menu');
            }
        }

        function updateUserDataUI() {
            if (currentUser) {
                document.getElementById('menuUserName').innerText = currentUser.name;
                document.getElementById('menuUserBalance').innerText = `ባላንስ: ${userBalance} ብር`;
                localStorage.setItem('win_balance', userBalance);
            }
        }

        function selectPrice(price) {
            selectedPrice = price;
            document.getElementById('roomSelectionTitle').innerText = `የእጣ ዋጋ: ${price} ብር - ክፍል ይምረጡ`;
            
            const container = document.getElementById('roomListContainer');
            container.innerHTML = '';

            const rooms = [
                { maxPlayers: 2, name: '2 እጣ የሚይዝ ክፍል (ለፈጣን ሙከራ)' },
                { maxPlayers: 20, name: '20 ተጫዋች ያለው ክፍል (100 እጣ)' },
                { maxPlayers: 50, name: '50 ተጫዋች ያለው ክፍል (100 እጣ)' },
                { maxPlayers: 100, name: '100 ተጫዋች ያለው ክፍል (100 እጣ)' }
            ];

            rooms.forEach(r => {
                let div = document.createElement('div');
                div.className = 'card';
                div.style.cursor = 'pointer';
                div.innerHTML = `<div style="font-weight: bold; font-size: 15px;">${r.name}</div>
                                 <div style="font-size: 12px; color: #666; margin-top: 5px;">እያንዳንዱ ቲኬት ${price} ብር</div>`;
                div.onclick = () => openGameRoom(r.maxPlayers, r.name);
                container.appendChild(div);
            });

            switchView('view-rooms');
        }

        function openGameRoom(maxPlayers, roomName) {
            selectedRoomMaxPlayers = maxPlayers;
            selectedTicket = null;

            let roomId = `room_${selectedPrice}_${maxPlayers}`;
            let roomsData = JSON.parse(localStorage.getItem('win_rooms')) || {};
            if (!roomsData[roomId]) {
                roomsData[roomId] = { tickets: {} };
                localStorage.setItem('win_rooms', JSON.stringify(roomsData));
            }

            document.getElementById('gameRoomTitle').innerText = roomName;
            
            let totalPool = selectedPrice * maxPlayers;
            let p1st = Math.round(totalPool * 0.60);
            let p2nd = Math.round(totalPool * 0.15);
            let p3rd = Math.round(totalPool * 0.05);

            document.getElementById('gamePoolInfo').innerText = `ጠቅላላ ገቢ (Pool): ${totalPool} ብር`;
            document.getElementById('gamePrizesInfo').innerHTML = 
                `🥇 <b>1ኛ እጣ (60%):</b> ${p1st} ብር<br>` +
                `🥈 <b>2ኛ እጣ (15%):</b> ${p2nd} ብр<br>` +
                `🥉 <b>3ኛ እጣ (5%):</b> ${p3rd} ብር`;

            loadTicketGrid(roomId);
            switchView('view-game');
        }

        function loadTicketGrid(roomId) {
            let roomsData = JSON.parse(localStorage.getItem('win_rooms')) || {};
            let room = roomsData[roomId] || { tickets: {} };
            let grid = document.getElementById('ticketGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= 100; i++) {
                let btn = document.createElement('div');
                let isTaken = room.tickets && room.tickets[i] ? true : false;
                btn.className = 'ticket' + (isTaken ? ' taken' : '');
                btn.innerText = i;
                if (!isTaken) {
                    btn.onclick = () => selectNumber(i, btn);
                }
                grid.appendChild(btn);
            }
        }

        function selectNumber(num, el) {
            document.querySelectorAll('.ticket').forEach(e => e.classList.remove('selected'));
            el.classList.add('selected');
            selectedTicket = num;
        }

        function buyTicket() {
            if (!selectedTicket) return alert('እባክዎን የእጣ ቁጥር ይምረጡ!');

            let roomId = `room_${selectedPrice}_${selectedRoomMaxPlayers}`;
            let roomsData = JSON.parse(localStorage.getItem('win_rooms')) || {};
            if (!roomsData[roomId]) {
                roomsData[roomId] = { tickets: {} };
            }
            let room = roomsData[roomId];

            if (userBalance < selectedPrice) {
                alert('ባላንስዎ በቂ አይደለም!');
                return;
            }

            if (room.tickets[selectedTicket]) {
                alert('ይህ ቁጥር ተይዟል!');
                loadTicketGrid(roomId);
                return;
            }

            // 1. ባላንስ መቀነስ
            userBalance -= selectedPrice;
            updateUserDataUI();

            // 2. እጣ መመዝገብ
            room.tickets[selectedTicket] = { userId: currentUser.id, userName: currentUser.name };
            let boughtCount = Object.keys(room.tickets).length;

            // 3. እጣ ማውጣት (የተያዙት እጣዎች ብዛት ከክፍሉ ከተወሰነው ብዛት ጋር ሲኩል)
            if (boughtCount >= selectedRoomMaxPlayers) {
                let boughtNumbers = Object.keys(room.tickets);
                let shuffled = [...boughtNumbers].sort(() => 0.5 - Math.random());

                let totalPool = selectedPrice * selectedRoomMaxPlayers;
                let p1stAmt = Math.round(totalPool * 0.60);
                let p2ndAmt = Math.round(totalPool * 0.15);
                let p3rdAmt = Math.round(totalPool * 0.05);

                let w1 = room.tickets[shuffled[0]];
                let w2 = room.tickets[shuffled[1]] || w1;
                let w3 = room.tickets[shuffled[2]] || w1;

                if (w1.userId === currentUser.id) userBalance += p1stAmt;
                if (w2.userId === currentUser.id) userBalance += p2ndAmt;
                if (w3.userId === currentUser.id) userBalance += p3rdAmt;

                updateUserDataUI();

                let resultMsg = `🎉 የዕጣው ውጤት አውቶማቲክ ወጥቷል! 🎉\n\n` +
                                `🥇 1ኛ እጣ (እጣ #${shuffled[0]}): ${w1.userName} 👉 ${p1stAmt} ብር አሸንፈዋል!\n` +
                                `🥈 2ኛ እጣ (እጣ #${shuffled[1]}): ${w2.userName} 👉 ${p2ndAmt} ብር አሸንፈዋል!\n` +
                                `🥉 3ኛ እጣ (እጣ #${shuffled[2]}): ${w3.userName} 👉 ${p3rdAmt} ብር አሸንፈዋል!`;

                alert(resultMsg);

                // ክፍሉን እንደገና ባዶ ማድረግ
                roomsData[roomId] = { tickets: {} };
            } else {
                alert(`እጣ ቁጥር #${selectedTicket} በ ${selectedPrice} ብር በስኬት ተይዟል!\nየተያዙ እጣዎች: ${boughtCount}/${selectedRoomMaxPlayers}`);
            }

            localStorage.setItem('win_rooms', JSON.stringify(roomsData));
            selectedTicket = null;
            loadTicketGrid(roomId);
        }
    </script>
</body>
</html>
